<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jose Siavichay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .tarjeta {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    text-align: center;
  }

  .avatar {
    position: relative;
    display: grid;
    place-items: center;
    width: 150px;
    height: 150px;
    margin: 0 auto 24px;
    border-radius: 50%;
    overflow: hidden;
    background: #eceafd;
    font-size: 72px;
    line-height: 1;
  }

  .avatar > * { grid-area: 1 / 1; }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .etiqueta {
    display: block;
    margin-bottom: 6px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8a8fa3;
  }

  h1 {
    font-size: 1.7rem;
    color: #1f2333;
    margin-bottom: 18px;
    line-height: 1.2;
  }

  .dato {
    padding: 12px 0;
    border-top: 1px solid #ececf2;
    font-size: 1.05rem;
    color: #3d4256;
  }

  .hobby {
    display: inline-block;
    margin-top: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    background: #f1efff;
    color: #5b4bc4;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="avatar">
      <span class="avatar-emoji">&#127925;</span>
      <img src="https://instagram.fcue2-1.fna.fbcdn.net/v/t51.82787-19/762585956_18107779199012024_4742091415058290513_n.jpg?stp=dst-jpg_s206x206_tt6&amp;_nc_cat=101&amp;ccb=7-5&amp;_nc_sid=bf7eb4&amp;efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&amp;_nc_ohc=SLqTCl0vi1AQ7kNvwGiyzoi&amp;_nc_oc=Adq8eO0sUzc4OQ3tc4_E3yV9JwaQawuTuknvD_wH3kUFUynI-eCTQt-PmmKCsIrR7Y4&amp;_nc_ad=z-m&amp;_nc_cid=0&amp;_nc_zt=24&amp;_nc_ht=instagram.fcue2-1.fna&amp;_nc_gid=oAYZT_Uy2URuZGK8cXgosw&amp;_nc_ss=7a22e&amp;oh=00_AQPCkcQxpu-XOyUXhH538WASP1ZDVZCbDfSN5b5MjrS6GQ&amp;oe=6ABFBA26" alt="Jose Siavichay" referrerpolicy="no-referrer">
    </div>

    <h1>Jose Siavichay</h1>

    <p class="dato">
      <span class="etiqueta">Carrera</span>
      Ingenier&iacute;a en Software
    </p>

    <p class="dato">
      <span class="etiqueta">Hobby</span>
      <span class="hobby">&#127925; Escuchar m&uacute;sica</span>
    </p>
  </main>
</body>
</html>
