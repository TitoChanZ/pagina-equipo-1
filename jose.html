<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jose Siavichay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .tarjeta {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    text-align: center;
  }

  .avatar {
    position: relative;
    display: grid;
    place-items: center;
    width: 150px;
    height: 150px;
    margin: 0 auto 24px;
    border-radius: 50%;
    overflow: hidden;
    background: #eceafd;
    font-size: 72px;
    line-height: 1;
  }

  .avatar > * { grid-area: 1 / 1; }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .etiqueta {
    display: block;
    margin-bottom: 6px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8a8fa3;
  }

  h1 {
    font-size: 1.7rem;
    color: #1f2333;
    margin-bottom: 18px;
    line-height: 1.2;
  }

  .dato {
    padding: 12px 0;
    border-top: 1px solid #ececf2;
    font-size: 1.05rem;
    color: #3d4256;
  }

  .hobby {
    display: inline-block;
    margin-top: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    background: #f1efff;
    color: #5b4bc4;
    font-weight: 600;
  }
</style>
</head>
